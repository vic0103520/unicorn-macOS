name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Print toolchain versions
      run: |
        xcodebuild -version
        swift --version
        printf 'Host architecture: %s\n' "$(uname -m)"
        sw_vers

    - name: Install SwiftLint 0.65.1
      env:
        SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        SWIFTLINT_VERSION: 0.65.1
      run: |
        install_dir="$RUNNER_TEMP/swiftlint-$SWIFTLINT_VERSION"
        archive="$RUNNER_TEMP/portable_swiftlint.zip"
        curl --fail --location --retry 3 \
          --output "$archive" \
          "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
        printf '%s  %s\n' "$SWIFTLINT_SHA256" "$archive" | shasum -a 256 --check
        mkdir -p "$install_dir"
        unzip -q "$archive" -d "$install_dir"
        chmod +x "$install_dir/swiftlint"
        printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/swiftlint" version

    - name: Run lint
      run: make lint

  native-tests-and-coverage:
    name: Native tests and coverage
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Print toolchain versions
      run: |
        xcodebuild -version
        swift --version
        printf 'Host architecture: %s\n' "$(uname -m)"
        sw_vers

    - name: Run native core tests and coverage
      run: |
        mkdir -p build/Diagnostics
        # The coverage target also cross-compiles the app. Xcode's automatic build-product
        # registration is contained by ephemeral runner teardown; CI never installs or activates it.
        make coverage VERBOSE=1 NO_COLOR=1 2>&1 | tee build/Diagnostics/native-tests-and-coverage.log
        xcrun xccov view --report --only-targets \
          build/Test/Results/UnicornCoreTests.xcresult \
          | tee build/Test/Results/coverage.txt

    - name: Upload native test .xcresult
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unicorn-native-test-xcresult-macos-15
        path: build/Test/Results/UnicornCoreTests.xcresult
        if-no-files-found: error
        retention-days: 14

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unicorn-coverage-macos-15
        path: build/Test/Results/coverage.txt
        if-no-files-found: error
        retention-days: 14

    - name: Upload native test diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unicorn-native-test-diagnostics-macos-15
        path: build/Diagnostics/native-tests-and-coverage.log
        if-no-files-found: error
        retention-days: 14

  address-undefined-sanitizers:
    name: Address and undefined-behavior sanitizers
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Print toolchain versions
      run: |
        xcodebuild -version
        swift --version
        printf 'Host architecture: %s\n' "$(uname -m)"
        sw_vers

    - name: Run hostless core tests with ASan and UBSan
      run: |
        root="$PWD/build/Sanitizers/AddressUndefined"
        rm -rf "$root"
        mkdir -p "$root" build/Diagnostics
        make test-native \
          XCODEBUILD='xcodebuild -enableAddressSanitizer YES -enableUndefinedBehaviorSanitizer YES' \
          TEST_ROOT="$root" \
          TEST_RESULT_BUNDLE="$root/UnicornCoreTests.xcresult" \
          NATIVE_ARCH="$(uname -m)" \
          VERBOSE=1 \
          NO_COLOR=1 \
          2>&1 | tee build/Diagnostics/address-undefined-sanitizers.log

    - name: Upload ASan and UBSan .xcresult
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unicorn-address-undefined-xcresult-macos-15
        path: build/Sanitizers/AddressUndefined/UnicornCoreTests.xcresult
        if-no-files-found: error
        retention-days: 14

    - name: Upload ASan and UBSan diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unicorn-address-undefined-diagnostics-macos-15
        path: build/Diagnostics/address-undefined-sanitizers.log
        if-no-files-found: error
        retention-days: 14

  thread-sanitizer:
    name: Thread sanitizer
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Print toolchain versions
      run: |
        xcodebuild -version
        swift --version
        printf 'Host architecture: %s\n' "$(uname -m)"
        sw_vers

    - name: Run hostless core tests with TSan
      run: |
        root="$PWD/build/Sanitizers/Thread"
        rm -rf "$root"
        mkdir -p "$root" build/Diagnostics
        make test-native \
          XCODEBUILD='xcodebuild -enableThreadSanitizer YES' \
          TEST_ROOT="$root" \
          TEST_RESULT_BUNDLE="$root/UnicornCoreTests.xcresult" \
          NATIVE_ARCH="$(uname -m)" \
          VERBOSE=1 \
          NO_COLOR=1 \
          2>&1 | tee build/Diagnostics/thread-sanitizer.log

    - name: Upload TSan .xcresult
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unicorn-thread-sanitizer-xcresult-macos-15
        path: build/Sanitizers/Thread/UnicornCoreTests.xcresult
        if-no-files-found: error
        retention-days: 14

    - name: Upload TSan diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unicorn-thread-sanitizer-diagnostics-macos-15
        path: build/Diagnostics/thread-sanitizer.log
        if-no-files-found: error
        retention-days: 14

  release-cross-architecture:
    name: Release and cross-architecture verification
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Print toolchain versions
      run: |
        xcodebuild -version
        swift --version
        printf 'Host architecture: %s\n' "$(uname -m)"
        sw_vers

    - name: Build Release app for arm64 and x86_64
      run: |
        # Xcode automatically registers macOS app build products. The effect is contained by
        # ephemeral runner teardown; CI never installs it, copies it into Input Methods, explicitly registers it, or activates it.
        root="$PWD/build/CIRelease"
        rm -rf "$root"
        mkdir -p "$root" build/Diagnostics
        make build-universal \
          CONFIG=Release \
          ARCHS='arm64 x86_64' \
          SYMROOT="$root/Products" \
          OBJROOT="$root/Intermediates" \
          VERBOSE=1 \
          NO_COLOR=1 \
          2>&1 | tee build/Diagnostics/release-cross-architecture.log

    - name: Verify Release bundle without installing it
      run: |
        scripts/ci/verify-release-build.sh \
          build/CIRelease/Products/Release/unicorn.app \
          2>&1 | tee -a build/Diagnostics/release-cross-architecture.log

    - name: Upload Release verification diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unicorn-release-verification-macos-15
        path: build/Diagnostics/release-cross-architecture.log
        if-no-files-found: error
        retention-days: 14
