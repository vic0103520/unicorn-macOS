name: CI

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10
    env:
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
      SWIFTLINT_VERSION: 0.65.1
    steps:
    - uses: &checkout-action actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache SwiftLint
      continue-on-error: true
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/unicorn-ci/swiftlint
        key: ${{ runner.os }}-${{ runner.arch }}-swiftlint-${{ env.SWIFTLINT_VERSION }}-${{ env.SWIFTLINT_SHA256 }}

    - name: Install SwiftLint
      run: |
        install_dir="$RUNNER_TEMP/swiftlint-$SWIFTLINT_VERSION"
        cache_dir="$HOME/.cache/unicorn-ci/swiftlint"
        archive="$cache_dir/portable_swiftlint.zip"
        mkdir -p "$cache_dir"
        if [[ ! -f "$archive" ]]; then
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
        fi
        printf '%s  %s\n' "$SWIFTLINT_SHA256" "$archive" | shasum -a 256 --check
        mkdir -p "$install_dir"
        unzip -q "$archive" -d "$install_dir"
        chmod +x "$install_dir/swiftlint"
        printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

    - name: Run lint
      run: make --silent lint

  native-tests-and-coverage:
    name: Tests and coverage
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: *checkout-action

    - name: Run tests
      run: make --silent _test

    - name: Report tests and coverage
      if: always()
      continue-on-error: true
      run: |
        result=build/Test/Results/UnicornCoreTests.xcresult
        if [[ -d "$result" ]]; then
          make --silent test-summary TEST_RESULT_BUNDLE="$result" NO_COLOR=1
        fi

    - name: Upload test diagnostics
      if: always()
      continue-on-error: true
      uses: &upload-artifact-action actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unicorn-test-diagnostics-macos-15
        path: build/Test/Results/UnicornCoreTests.xcresult
        if-no-files-found: warn
        retention-days: 14

  sanitizer-verification:
    name: Address and undefined-behavior sanitizers
    needs: native-tests-and-coverage
    runs-on: macos-15
    timeout-minutes: 25
    steps:
    - uses: *checkout-action

    - name: Run sanitizer tests
      run: |
        root="$PWD/build/Sanitizers/AddressUndefined"
        rm -rf "$root"
        mkdir -p "$root"
        make --silent _test \
          XCODEBUILD='xcodebuild -enableAddressSanitizer YES -enableUndefinedBehaviorSanitizer YES' \
          TEST_ROOT="$root" \
          TEST_RESULT_BUNDLE="$root/UnicornCoreTests.xcresult"

    - name: Report sanitizer test results
      if: always()
      continue-on-error: true
      run: |
        result=build/Sanitizers/AddressUndefined/UnicornCoreTests.xcresult
        if [[ -d "$result" ]]; then
          make --silent test-summary TEST_RESULT_BUNDLE="$result" NO_COLOR=1
        fi

    - name: Upload test diagnostics
      if: always()
      continue-on-error: true
      uses: *upload-artifact-action
      with:
        name: unicorn-address-undefined-test-diagnostics-macos-15
        path: build/Sanitizers/AddressUndefined/UnicornCoreTests.xcresult
        if-no-files-found: warn
        retention-days: 14

  release-cross-architecture:
    name: Release bundle verification
    runs-on: macos-15
    timeout-minutes: 25
    steps:
    - uses: *checkout-action

    - name: Build Release app
      run: |
        # Xcode automatically registers macOS app build products. The effect is contained by
        # ephemeral runner teardown; CI never installs it, copies it into Input Methods, explicitly registers it, or activates it.
        root="$PWD/build/CIRelease"
        rm -rf "$root"
        mkdir -p "$root"
        make --silent build \
          CONFIG=Release \
          ARCH=universal \
          SYMROOT="$root/Products" \
          OBJROOT="$root/Intermediates"

    - name: Verify required bundle files
      env:
        APP_BUNDLE: build/CIRelease/Products/Release/unicorn.app
      run: |
        required_paths=(
          "$APP_BUNDLE/Contents/MacOS/unicorn"
          "$APP_BUNDLE/Contents/Info.plist"
          "$APP_BUNDLE/Contents/Resources/keymap.json"
          "$APP_BUNDLE/Contents/Resources/Base.lproj/Main.storyboardc/Info.plist"
          "$APP_BUNDLE/Contents/Resources/en.lproj/InfoPlist.strings"
        )
        for path in "${required_paths[@]}"; do
          if [[ ! -f "$path" ]]; then
            echo "Missing expected bundle file: $path" >&2
            exit 1
          fi
          printf 'Found bundle file: %s\n' "$path"
        done

    - name: Verify bundle metadata
      env:
        APP_BUNDLE: build/CIRelease/Products/Release/unicorn.app
      run: |
        info_plist="$APP_BUNDLE/Contents/Info.plist"
        build_settings=$(xcodebuild \
          -project unicorn.xcodeproj \
          -target unicorn \
          -configuration Release \
          -showBuildSettings)

        build_setting() {
          local name=$1
          awk -F ' = ' -v name="$name" '$1 == "    " name { print $2; exit }' <<< "$build_settings"
        }

        assert_plist_matches_setting() {
          local plist_key=$1
          local setting_name=$2
          local actual expected
          actual=$(/usr/libexec/PlistBuddy -c "Print :$plist_key" "$info_plist")
          expected=$(build_setting "$setting_name")
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "$plist_key mismatch: actual='$actual', $setting_name='$expected'" >&2
            exit 1
          fi
          echo "$plist_key: $actual"
        }

        assert_plist_matches_setting CFBundleIdentifier PRODUCT_BUNDLE_IDENTIFIER
        assert_plist_matches_setting CFBundleShortVersionString MARKETING_VERSION
        assert_plist_matches_setting CFBundleVersion CURRENT_PROJECT_VERSION
        assert_plist_matches_setting LSMinimumSystemVersion MACOSX_DEPLOYMENT_TARGET

    - name: Verify strict ad-hoc signature
      env:
        APP_BUNDLE: build/CIRelease/Products/Release/unicorn.app
      run: |
        codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
        signing_details=$(codesign -dvvv "$APP_BUNDLE" 2>&1)
        printf '%s\n' "$signing_details"
        grep -q '^Signature=adhoc$' <<< "$signing_details"
        grep -q '^TeamIdentifier=not set$' <<< "$signing_details"
        echo "Release bundle verification passed. Cross-architecture compilation is not runtime compatibility evidence."
