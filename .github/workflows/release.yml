name: Release

on:
  push:
    tags:
      - 'v*'
      - 'test-v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
    - name: Check out the tagged source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Validate release version contract
      run: |
        set -euo pipefail
        marketing_version="$(./scripts/release-version.sh "$RELEASE_TAG")"
        case "$RELEASE_BUILD_NUMBER" in
          ''|0|*[!0-9]*)
            echo "Invalid GitHub Actions run number: $RELEASE_BUILD_NUMBER" >&2
            exit 1
            ;;
        esac
        echo "RELEASE_MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
        printf 'Release contract: tag=%s marketing-version=%s build-number=%s\n' \
          "$RELEASE_TAG" "$marketing_version" "$RELEASE_BUILD_NUMBER"

    - name: Run release and installer regression tests
      run: |
        set -euo pipefail
        make test-scripts

    - name: Build and package final release bytes
      run: |
        set -euo pipefail
        make release-artifacts \
          TAG="$RELEASE_TAG" \
          MARKETING_VERSION="$RELEASE_MARKETING_VERSION" \
          BUILD_NUMBER="$RELEASE_BUILD_NUMBER" \
          DIST_DIR=dist

    - name: Create complete draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if existing_draft="$(gh release view "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
          if [ "$existing_draft" != true ]; then
            echo "Refusing to reuse published production tag: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release delete "$RELEASE_TAG" --yes --repo "$GITHUB_REPOSITORY"
        fi
        gh release create "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --verify-tag \
          --draft \
          --title "Unicorn $RELEASE_MARKETING_VERSION" \
          --notes-file dist/RELEASE_NOTES.md \
          dist/unicorn-macos.zip \
          dist/SHA256SUMS \
          dist/UNICORN_EXECUTABLE_SHA256

    - name: Download and verify exact draft assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        actual_tag="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
        actual_title="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)"
        actual_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
        [ "$actual_tag" = "$RELEASE_TAG" ]
        [ "$actual_title" = "Unicorn $RELEASE_MARKETING_VERSION" ]
        [ "$actual_draft" = true ]

        printf '%s\n' SHA256SUMS UNICORN_EXECUTABLE_SHA256 unicorn-macos.zip | LC_ALL=C sort > expected-assets.txt
        gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
          --json assets --jq '.assets[].name' | LC_ALL=C sort > actual-assets.txt
        cmp expected-assets.txt actual-assets.txt

        rm -rf downloaded-release extracted-release
        mkdir downloaded-release
        gh release download "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --dir downloaded-release \
          --pattern unicorn-macos.zip \
          --pattern SHA256SUMS \
          --pattern UNICORN_EXECUTABLE_SHA256
        cmp dist/unicorn-macos.zip downloaded-release/unicorn-macos.zip
        cmp dist/SHA256SUMS downloaded-release/SHA256SUMS
        cmp dist/UNICORN_EXECUTABLE_SHA256 downloaded-release/UNICORN_EXECUTABLE_SHA256

        gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > downloaded-release/RELEASE_BODY.md
        ./scripts/verify-release.sh \
          "$RELEASE_TAG" \
          "$RELEASE_BUILD_NUMBER" \
          downloaded-release \
          extracted-release \
          downloaded-release/RELEASE_BODY.md

    - name: Install the verified downloaded bytes in isolation
      run: |
        set -euo pipefail
        isolated_home="$RUNNER_TEMP/unicorn-release-home"
        install_dir="$isolated_home/Library/Input Methods"
        rm -rf "$isolated_home"
        mkdir -p "$isolated_home"
        xattr -w com.apple.quarantine '0081;66000000;Safari;' extracted-release/unicorn.app
        HOME="$isolated_home" \
          UNICORN_INSTALL_DIR="$install_dir" \
          UNICORN_ASSUME_YES=1 \
          /bin/sh extracted-release/install.sh
        installed_app="$install_dir/unicorn.app"
        [ "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$installed_app/Contents/Info.plist")" = "$RELEASE_MARKETING_VERSION" ]
        [ "$(/usr/bin/plutil -extract CFBundleVersion raw -o - "$installed_app/Contents/Info.plist")" = "$RELEASE_BUILD_NUMBER" ]
        if xattr -r "$installed_app" 2>/dev/null | grep -Fq com.apple.quarantine; then
          echo 'Installed app retained the quarantine attribute.' >&2
          exit 1
        fi
        echo "Verified downloaded release installed in isolation: $installed_app"

    - name: Publish verified production release
      if: startsWith(github.ref_name, 'v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        published_tag="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
        published_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
        [ "$published_tag" = "$RELEASE_TAG" ]
        [ "$published_draft" = false ]
        echo "Published verified release: $RELEASE_TAG"

    - name: Clean up unpublished test release
      if: startsWith(github.ref_name, 'test-v') && always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        release_error="$(mktemp)"
        if is_draft="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft 2>"$release_error")"; then
          [ "$is_draft" = true ] || { echo "Refusing to delete a published test release" >&2; exit 1; }
          gh release delete "$RELEASE_TAG" --yes --repo "$GITHUB_REPOSITORY"
        elif ! grep -Fq '(HTTP 404)' "$release_error"; then
          cat "$release_error" >&2
          exit 1
        fi

        ref_error="$(mktemp)"
        if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>"$ref_error"; then
          gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
        elif ! grep -Fq '(HTTP 404)' "$ref_error"; then
          cat "$ref_error" >&2
          exit 1
        fi
        rm -f "$release_error" "$ref_error"
        echo "Unpublished test release and tag are absent: $RELEASE_TAG"
